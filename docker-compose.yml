# Postgres is hosted on Supabase (see .env) — not run locally.
#
# docling-parse (a docling dependency) is a C++ extension with no prebuilt
# wheel for this machine's Python/arch combo, forcing a slow from-source
# CMake build locally. The Docker image is linux/amd64 with manylinux wheels
# available, so `docker compose run app ...` is the supported way to run the
# pipeline/ingestion on this machine.
#
#   docker compose up -d qdrant api ui      # web app on http://localhost:3000
#   docker compose run --rm app python -m pipeline.run judgment.pdf
services:
  app:
    build: .
    env_file: .env
    environment:
      # Persist HuggingFace model weights (BGE-M3, reranker, docling models)
      # across `--rm` container runs by keeping the cache on the bind-mounted
      # volume instead of the throwaway container filesystem.
      - HF_HOME=/app/.hf_cache
    volumes:
      - .:/app
    depends_on:
      - qdrant
    tty: true
    stdin_open: true

  # HTTP API (FastAPI). Same image as `app`; models stay loaded between documents.
  # Set LEGAL_AI_DEMO_MODE=1 in .env to run it without Docling/LLM/DB access.
  api:
    build: .
    env_file: .env
    environment:
      - HF_HOME=/app/.hf_cache
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    depends_on:
      - qdrant
    restart: unless-stopped

  # Web UI: static React build served by nginx, which proxies /api to `api`.
  ui:
    build: ./ui
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  qdrant_data:
